<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.8)"/>
    </linearGradient>

    <!-- Glow filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <radialGradient id="radial-glow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Canvas Frame -->
  <rect width="1200" height="400" rx="16" fill="url(#bg-grad)"/>
  
  <!-- Subtle Grid lines -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
  </g>

  <!-- Ambient Light Sphere -->
  <circle cx="600" cy="160" r="320" fill="url(#radial-glow)"/>

  <!-- Border -->
  <rect width="1198" height="398" x="1" y="1" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5"/>

  <!-- Top Status / Version Pill -->
  <g transform="translate(600, 75)">
    <rect x="-115" y="-16" width="230" height="32" rx="16" fill="#1e293b" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
    <circle cx="-85" cy="0" r="4" fill="#10b981"/>
    <text x="-70" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="1">TAURI 2.0 • RUST CORE</text>
  </g>

  <!-- Main Hero Title -->
  <g transform="translate(600, 165)">
    <text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5" fill="#ffffff">
      Tool<tspan fill="url(#accent-cyan)">Hub</tspan>
    </text>
  </g>

  <!-- Tagline -->
  <g transform="translate(600, 215)">
    <text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Швейцарский нож вайбкодера: AI Sentinel, Anti-pHash медиа и DevTools
    </text>
  </g>

  <!-- Feature Pills / Highlights -->
  <g transform="translate(600, 290)">
    <!-- Pill 1: Claude Sentinel -->
    <g transform="translate(-390, 0)">
      <rect x="0" y="0" width="180" height="42" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <circle cx="20" cy="21" r="4" fill="#ef4444"/>
      <text x="34" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="600" fill="#e2e8f0">Claude Sentinel</text>
    </g>

    <!-- Pill 2: Kill-Switch -->
    <g transform="translate(-195, 0)">
      <rect x="0" y="0" width="180" height="42" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <circle cx="20" cy="21" r="4" fill="#10b981"/>
      <text x="34" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="600" fill="#e2e8f0">Zero-Leak WFP</text>
    </g>

    <!-- Pill 3: Video DSP -->
    <g transform="translate(5, 0)">
      <rect x="0" y="0" width="185" height="42" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <circle cx="20" cy="21" r="4" fill="#06b6d4"/>
      <text x="34" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="600" fill="#e2e8f0">Anti-pHash &amp; C2PA</text>
    </g>

    <!-- Pill 4: DevTools -->
    <g transform="translate(205, 0)">
      <rect x="0" y="0" width="180" height="42" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <circle cx="20" cy="21" r="4" fill="#a855f7"/>
      <text x="34" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="600" fill="#e2e8f0">Ports &amp; KeepAwake</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="350" y="380" width="500" height="2" rx="1" fill="url(#accent-cyan)" opacity="0.6"/>
</svg>
